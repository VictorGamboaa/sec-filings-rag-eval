# Answer key — filing RAG evaluation harness
#
# 26 entries scored against outputs/index/main. Every quote in this file has
# been asserted verbatim against that index by tools/verify_key.py BEFORE being
# written: a quote that did not match was never committed, and the nearest real
# span was inspected by hand instead. Entries drafted from a summarising fetch
# were rejected on exactly this test -- three of them, in the first pass.
#
# ENTRY TYPES AND WHAT EACH IS SCORED ON
#
#   single_fact (14)         Recall of a specific chunk. The ground truth names
#                            one accession and one document; a match in a
#                            different document of the same filing does not
#                            count. q27 in particular lives in an EXHIBIT, not
#                            the 8-K primary, and is the measurement that says
#                            whether fetching exhibits paid off.
#
#   cross_company (1)        Recall over a SET. Every listed accession must
#                            appear in top-k; a partial set scores as a miss.
#
#   period_over_period (5)   Recall over a SET across two filing dates. The
#                            finding is the CHANGE between them, so returning
#                            one period only is a miss.
#
#   negative_control (5)     ground_truth null by construction. Not scored on
#                            recall. Scored on whether the top similarity score
#                            is distinguishably lower than for answerable
#                            questions.
#
#   dedup_diagnostic (1)     Not scored on recall at all. Measures how widely
#                            one string occurs: count DISTINCT accessions and
#                            DISTINCT chunk texts in top-20. A high accession
#                            count against a low text count means the retriever
#                            is returning the same boilerplate from different
#                            filings, and deduplication is worth doing.
#
# STATUS LEGEND
#   verified        quote confirmed verbatim against the index and scoreable
#   TO_WRITE        question itself not written yet
#
# SCORING NOTES THAT APPLY TO THE KEY AS A WHOLE
#
#   * Score on ACCESSION COVERAGE, not on text. Several quotes are verbatim in
#     more than one filing -- q19's hedging sentence is byte-identical across
#     all eight AGNC 10-Qs, and q01's acquisition note recurs in later HON
#     filings. A retriever can return textually correct chunks from the wrong
#     filing. Only accession-and-document scoping distinguishes a hit from a
#     coincidence, which is what tools/verify_key.py enforces.
#
#   * Some section labels are known to be wrong, and are recorded as the index
#     has them rather than as the filing reads. HON and AIG notes are labelled
#     part2_item1a_risk_factors or part1_item2_mdna because the Item 1A anchor
#     matches early and absorbs the notes region; AGNC financial statements are
#     unsectioned entirely. Fixing the anchors changes the chunk fingerprint,
#     re-chunks the corpus and invalidates every section value here --
#     verify_key will show the mismatch immediately.
#
# DELIBERATELY REMOVED -- these are scope decisions, not unwritten stubs
#
#   q14  A second cross_company question. Removed: five cross-sector names
#        share too little comparable disclosure for it to mean anything.
#   q20  A sixth period_over_period question. Removed: five already make the
#        type meaningful.
#
# HOW TO FIX OR ADD AN ENTRY (about 2 minutes each)
#   Find the chunk, then copy its real wording -- never transcribe from the
#   rendered filing, which differs from the extracted text (the extractor emits
#   "$ 4,913 million" and "100 %", with spaces).
#
#     cd ~/dev/rag-test
#     python - <<'PY'
#     import json
#     ACC, TERM = "0000773840-24-000082", "Access Solutions"
#     for line in open("outputs/index/main/metadata.jsonl"):
#         r = json.loads(line)
#         if r.get("accession") == ACC and TERM.lower() in r.get("text","").lower():
#             print(r["chunk_id"], "|", r.get("section"))
#             print(r["text"][:1200]); print("-"*70)
#     PY
#
#   Copy a distinctive 10-20 word span from the printed text into `quote`, set
#   `section` from what it prints, then run:
#
#     uv run python -m tools.verify_key --only <id>

# =============================================================================
