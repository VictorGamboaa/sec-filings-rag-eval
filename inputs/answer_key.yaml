    ticker: HON
    accession: ANY
    document: ANY
    section: None
    quote: |-
      d-2(b)) ☐ Pre-commencement communications pursuant to Rule 13e-4(c) under the Exchange Act (17 CFR 240.13e-4(c)) Securities registered pursuant to Section 12(b) of the Act: Title of each class Trading Symbol(s) Name of each exchange on which registered Common Stock, par value $1 per share HON The Nasdaq Stock Market LLC 3.500% Senior Notes due 2027 HON 27 The Nasdaq Stock Market LLC 2.250% Senior Notes due 2028 HON 28A The Nasdaq Stock Market LLC 3.375% Senior Notes due 2030 HON 30 The Nasdaq Stock Market LLC 0.750% Senior Notes due 2032 HON 32 The Nasdaq Stock Market LLC 3.750% Senior Notes due 2032 HON 32A The Nasdaq Stock Market LLC 4.125% Senior Notes due 2034 HON 34 The Nasdaq Stock Market LLC 3.750% Senior Notes due 2036 HON 36 The Nasdaq Stock Market LLC Indicate by check mark whether the registrant is an emerging growth company as defined in Rule 405 of the Securities Act of 1933 (§230.405 of this chapter) or Rule 12b-2 of the Securities Exchange Act of 1934 (§240.12b-2 of this chapter). Emerging Growth Company ☐ If an emerging growth company, indicate by check mark if the registrant has elected not to use the extended transition period for complying with any new or revised financial accounting standards provided pursuant to Section 13(a) of the Exchange Act. ☐
