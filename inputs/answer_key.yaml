- id: q01
  type: single_fact
  status: verified
  question: "How much did Honeywell pay for Carrier's Global Access Solutions business?"
  ground_truth:
    ticker: HON
    accession: "0000773840-24-000082"
    document: hon-20240630.htm
    section: part2_item1a_risk_factors
    quote: "for total consideration of $ 4,913 million, net of cash acquired"
  notes: >
    Carrier Global Corporation's Global Access Solutions business
    (referred to as "Access Solutions" in the filing), acquired 3 June 2024.
    Quote verified verbatim in Note 3, chunk ordinals 16-17.
    The quote carries the figure rather than the business name because the
    two sit either side of a long appositive in the same sentence and no
    span of reasonable length holds both.
    NOTE THE SPACING: the extracted text reads "$ 4,913 million" and
    "100 %" -- the v1 quote used "$4,913" and "100%" and so matched nothing.
    This span also occurs in 7 chunks corpus-wide (Honeywell repeats the
    acquisition note in later 10-Qs); scoring must stay scoped to the
    accession and document, which verify_key does.

