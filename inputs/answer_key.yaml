- id: q18
  type: period_over_period
  status: verified
  question: "How did AIG's retained ownership in Corebridge and its accounting treatment change between 2024 and 2026?"
  ground_truth:
    - ticker: AIG
      accession: "0000005272-24-000079"
      document: aig-20240630.htm
      section: part1_item2_mdna
      quote: "Corebridge retained investment ( 48.4 % @ 28.90 per share at June 9, 2024)"
    - ticker: AIG
      accession: "0000005272-26-000052"
      document: aig-20260331.htm
      section: part1_item2_mdna
      quote: "AIG held 5.6 percent of the outstanding common stock of Corebridge and we concluded that we no longer have the ability to exert significant influence over Corebridge"
  notes: >
    Retained ownership falls from 48.4% at the June 2024 deconsolidation to
    5.6% at 2026-03-31, and the accounting treatment changes with it: AIG
    concluded it no longer exerts significant influence, so the holding moved
    from an equity method investment to an equity security at fair value.
    The change in treatment, not the falling number, is the disclosure event.
    ASYMMETRIC RECALL IS EXPECTED HERE, AND IS NOT A DEFECT. The 2024 span is
    TABULAR -- a row of the loss-on-deconsolidation table, reading
    "Corebridge retained investment ( 48.4 % @ 28.90 per share...)", with the
    spacing the extractor produces from table cells. The 2026 span is ordinary
    PROSE. An embedding model handles the two very differently, so the two
    accessions will not be recalled at comparable ranks. Score coverage of both
    accessions; do not read a rank gap between them as a retrieval failure.
    Sections read part1_item2_mdna for both, but the text is plainly Notes to
    the Condensed Consolidated Financial Statements -- the AIG anchor mislabel
    noted in the header.

