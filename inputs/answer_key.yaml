    31 accessions. Verified against the index:
    34 matching chunks / 34 distinct accessions /
    3 distinct chunk texts.
    NO span isolates exactly the 31: three further chunks contain this
    block in full with different chunk boundaries (1292 and 1915 chars),
    so any substring search returns 34. That floor is the honest
    measurement, not a defect in the quote.
    METRIC: count DISTINCT accessions and DISTINCT chunk texts in top-20.
    A ratio near 34:3 means the retriever is returning the same
    cover-page text from different filings, and deduplication is worth doing.
    The previous quote ("855 S. Mint Street") measured nothing: it sits in
    chunk_ordinal 0, whose text differs per filing (7 hits, 7 distinct texts).

