[project]
name = "rag-test"
version = "0.1.0"
description = "Ingestion and retrieval pipeline for SEC filings, built to measure retrieval quality, scaling behavior, build cost, and throughput."
# Upper bound is deliberate. Ubuntu 26.04 ships Python 3.14, which satisfies
# >=3.12 but has no manylinux wheels for faiss-cpu or torch -- resolution would
# succeed and then strand us on a source build of faiss. Pinned to 3.12 here and
# in .python-version so the interpreter cannot drift with the distro.
requires-python = ">=3.12,<3.13"

dependencies = [
    # Configuration and credentials
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # SEC EDGAR access
    "httpx>=0.27",
    # Embedding and indexing
    "numpy>=1.26",
    # Declared directly, though sentence-transformers would pull it anyway:
    # [tool.uv.sources] only applies to direct dependencies, so the CPU-index
    # pin below is silently ignored if torch arrives transitively.
    "torch>=2.0",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    # Hosted embedding provider. Optional at runtime -- the embedder seam
    # imports it lazily, so the local providers work without it.
    "voyageai>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# Host is a Qualcomm Oryon (aarch64) with no NVIDIA GPU. Default PyPI torch --
# on linux-aarch64 as well as x86_64 -- pulls the CUDA build and ~17 nvidia-*
# runtime wheels totalling several GB, all of it dead weight here. Pinning the
# CPU index drops those entirely (verified: torch==2.14.0+cpu, 0 nvidia pkgs).
[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[tool.pytest.ini_options]
# The project is not installed as a package (package = false above), so the repo
# root goes on sys.path for `import tools`. Tests also load inputs/config.yaml by
# its default relative path, which requires the repo root as rootdir.
pythonpath = ["."]
testpaths = ["tests"]
