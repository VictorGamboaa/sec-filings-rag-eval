[project]
name = "rag-test"
version = "0.1.0"
description = "Ingestion and retrieval pipeline for SEC filings, built to measure retrieval quality, scaling behavior, build cost, and throughput."
requires-python = ">=3.12"

dependencies = [
    # Configuration and credentials
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # SEC EDGAR access
    "httpx>=0.27",
    # Embedding and indexing
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# torch wheels are large; resolution is slow but installs are cached.
package = false
